name = "cf-ai-echomind"
main = "src/index.js"
compatibility_date = "2024-01-01"

# AI Model Bindings
[ai]
binding = "AI"

# Database Binding (D1)
[[d1_databases]]
binding = "DB"
database_name = "echomind_db"
database_id = "your-d1-id-here" # You get this after running 'npx wrangler d1 create echomind_db'

# Durable Objects (for Session Memory)
[[durable_objects.bindings]]
name = "SESSION_STATE"
class_name = "SessionObject"

[[migrations]]
tag = "v1"
new_classes = ["SessionObject"]