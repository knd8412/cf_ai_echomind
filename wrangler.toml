name = "cf-ai-echomind"
main = "src/index.js"
compatibility_date = "2024-01-01"

# AI Model Bindings
[ai]
binding = "AI"

# Database Binding (D1)
[[d1_databases]]
binding = "DB"
database_name = "echomind_db"
database_id = "2e406b7b-209c-4887-b49d-dcba64ce858c"

# Durable Objects (for Session Memory)
[[durable_objects.bindings]]
name = "SESSION_STATE"
class_name = "SessionObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionObject"]